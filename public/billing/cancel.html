<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>キャンセルされました — コードだもん</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .billing-card { max-width: 440px; width: 100%; background: #fff; border: 2px solid #fde68a; border-radius: 16px; padding: 32px; text-align: center; box-shadow: 0 4px 12px rgba(120, 53, 15, 0.08); }
    .billing-card h1 { color: #92400e; font-size: 22px; margin: 0 0 12px; }
    .billing-card p { color: #422006; font-size: 14px; line-height: 1.7; margin: 0 0 10px; }
    .billing-card .btn-primary { display: inline-block; margin-top: 20px; padding: 10px 24px; background: #059669; color: #fff; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 14px; }
    .billing-card .btn-primary:hover { background: #047857; }
  </style>
</head>
<body>
  <div class="billing-card">
    <h1>キャンセルされたのだ</h1>
    <p>決済はまだ行われていないのだ。気が向いたらまた戻ってきてほしいのだ！</p>
    <a class="btn-primary" href="/">アプリに戻る</a>
  </div>
</body>
</html>
