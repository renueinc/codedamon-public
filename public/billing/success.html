<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>アップグレード完了 — コードだもん</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .billing-card { max-width: 440px; width: 100%; background: #fff; border: 2px solid #bbf7d0; border-radius: 16px; padding: 32px; text-align: center; box-shadow: 0 4px 12px rgba(6, 78, 59, 0.08); }
    .billing-card h1 { color: #059669; font-size: 22px; margin: 0 0 12px; }
    .billing-card p { color: #064e3b; font-size: 14px; line-height: 1.7; margin: 0 0 10px; }
    .billing-card .hint { font-size: 12px; color: #6b8a7a; margin-top: 12px; }
    .billing-card .btn-primary { display: inline-block; margin-top: 20px; padding: 10px 24px; background: #059669; color: #fff; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 14px; }
    .billing-card .btn-primary:hover { background: #047857; }
  </style>
</head>
<body>
  <div class="billing-card">
    <h1>アップグレードありがとうなのだ！</h1>
    <p>お支払いが完了したのだ。これからもどうぞよろしくなのだ！</p>
    <p class="hint">※ プラン反映まで数秒かかることがあるのだ。アカウントメニューから最新のプランを確認できるのだ。</p>
    <a class="btn-primary" href="/">アプリに戻る</a>
  </div>
</body>
</html>
